name: Deploy reader to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage public files only
        run: |
          mkdir -p site/books site/icons
          cp index.html styles.css app.js books.js favicon.svg manifest.webmanifest sw.js site/
          find books -type f -name 'chapter-*.json' -print0 | while IFS= read -r -d '' file; do
            mkdir -p "site/$(dirname "$file")"
            cp "$file" "site/$file"
          done
          cp icons/*.png site/icons/
          sed -i "s/__BUILD_VERSION__/${GITHUB_SHA}/g" site/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

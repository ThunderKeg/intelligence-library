<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f6f2" />
    <meta name="description" content="算经阁：可离线阅读、记住进度的个人学习书架。" />
    <title>算经阁 · 个人书架</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <script src="books.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./">算经阁</a>
      <span class="header-note">个人书架</span>
    </header>

    <main>
      <section id="landing-view" class="shelf" aria-labelledby="shelf-title">
        <div class="shelf-heading">
          <h1 id="shelf-title">我的书架</h1>
          <span id="book-count"></span>
        </div>
        <label class="search-field">
          <span class="sr-only">搜索书名或作者</span>
          <input id="search" type="search" placeholder="搜索书名或作者" autocomplete="off" />
        </label>
        <div id="book-grid" class="book-grid"></div>
        <p id="empty-state" class="empty-state" hidden>没有找到图书。</p>
      </section>

      <section id="reader-view" class="reader-view" hidden aria-label="图书阅读器">
        <div class="reader-progress-track" aria-hidden="true"><span id="reading-progress"></span></div>
        <div class="reader-topbar">
          <a class="back-link" href="./">← 书架</a>
          <span id="reader-book-title"></span>
        </div>
        <div class="reader-layout">
          <aside class="reader-sidebar" aria-label="章节目录">
            <details id="reader-menu">
              <summary>目录</summary>
              <nav id="reader-toc" aria-label="本章目录"></nav>
            </details>
          </aside>
          <div class="reader-main">
            <p id="reader-status" class="reader-status" role="status" hidden></p>
            <article id="reader-article" class="reader-article"></article>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
